name: .NET Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Changed from ubuntu-latest to windows-latest to support your Windows project
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build Project
      run: dotnet build --no-restore --configuration Release
